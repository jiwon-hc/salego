name: daily-prices

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-prices

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - run: pip install -r collector/requirements.txt
      - run: python collector/test_parse.py
      # Seeds from the committed snapshot, so change detection and the
      # failed-fetch fallback see yesterday's prices. A spot-check miss exits 1
      # and nothing is committed: yesterday's data stays live.
      - run: python collector/run.py
      # Pages that hit rate limits get one slower pass.
      - run: python collector/run.py --retry-failed
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/data data
          git diff --cached --quiet || git commit -m "data: prices $(date -u +%F)"
          git push

  deploy:
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
